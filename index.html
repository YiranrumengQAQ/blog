<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 站点名走语言包 site.blogName（缺失时回退 config.json 的 blogName） -->
    <title data-i18n="site.blogName">猫猫的回忆</title>
    <meta name="description" content="记录温暖时光的静态博客" data-i18n-attr="content:site.description">
    <meta name="theme-color" content="#FDFBF7">
    <script>
        // 防止主题闪烁（FOUC）：必须放在 <head> 内、首帧渲染前同步执行。
        // theme.js 在页面底部 defer 加载，若用户偏好暗色，等它执行时页面已经
        // 按默认的亮色画过一帧了。这里提前读 localStorage 把暗色写到 <html> 上。
        // 键名与 assets/js/ui/theme.js 的 STORAGE_KEY（blog-theme）保持一致。
        (function () {
            try {
                var saved = localStorage.getItem('blog-theme');
                var dark = saved === 'dark' ||
                    (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', '#141218'); // 与 theme.js 的暗色同步
                }
            } catch (e) { /* 隐私模式等 localStorage 不可用时按默认亮色 */ }
        })();
    </script>
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/article.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <!-- noscript 里的内容只有在"禁用 JS"时才会显示，而 i18n 本身要靠 JS 运行，
         所以这句话无法走语言包，这里直接中英双语写死；
         图标也直接内联（JS 关掉时 icons.js 不会执行，不能用 data-icon 占位符） -->
    <noscript>
        <p class="nojs-tip">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="6.6" cy="10.6" rx="1.9" ry="2.5"/><ellipse cx="10.4" cy="7" rx="1.9" ry="2.6"/><ellipse cx="14.6" cy="7" rx="1.9" ry="2.6"/><ellipse cx="18.4" cy="10.6" rx="1.9" ry="2.5"/><path d="M12.5 12.6c-3 0-5.9 2.4-5.9 5 0 1.7 1.4 2.9 3.1 2.9 1.1 0 1.9-.5 2.8-.5s1.7.5 2.8.5c1.7 0 3.1-1.2 3.1-2.9 0-2.6-2.9-5-5.9-5z"/>
            </svg>
            这个博客需要启用 JavaScript 才能阅读哦～ / This blog needs JavaScript enabled.
        </p>
    </noscript>

    <!-- 阅读进度条（文章页显示） -->
    <div class="reading-progress" id="readingProgress" hidden>
        <div class="reading-progress-bar" id="readingProgressBar"></div>
    </div>

    <!-- 顶栏 -->
    <header class="site-header" id="siteHeader">
        <div class="header-inner">
            <a class="blog-name" href="#/" title="返回首页" data-i18n-attr="title:nav.backHome">
                <span id="headerBlogName" data-i18n="site.blogName">猫猫的回忆</span>
                <span class="paw-dot"></span>
                <span class="paw-dot"></span>
                <span class="paw-dot"></span>
            </a>
            <div class="header-actions">
                <div class="search-wrap" id="searchWrap">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索文章…"
                        autocomplete="off" aria-label="搜索文章"
                        data-i18n-attr="placeholder:nav.searchPlaceholder;aria-label:nav.searchAria">
                    <button class="search-clear" id="searchClear" aria-label="清除搜索"
                        data-i18n-attr="aria-label:nav.searchClear"><svg class="icon" data-icon="x"></svg></button>
                    <span class="search-kbd" aria-hidden="true">/</span>
                    <span class="search-icon" aria-hidden="true"><svg class="icon" data-icon="search"></svg></span>
                </div>
                <button class="mobile-search-btn" id="mobileSearchBtn" aria-label="打开搜索" title="搜索"
                    data-i18n-attr="aria-label:nav.searchOpen;title:nav.search">
                    <svg class="icon" data-icon="search"></svg>
                </button>
                <!-- 语言切换：选项由 config.json 的 languages 自动生成 -->
                <div class="lang-wrap" id="langWrap" hidden>
                    <select class="lang-select" id="langSelect" aria-label="选择界面语言" title="选择界面语言"
                        data-i18n-attr="aria-label:nav.languageAria;title:nav.languageAria"></select>
                </div>
                <button class="m3-icon-btn theme-toggle" id="themeToggle" aria-label="切换主题" title="切换亮色/暗色主题"
                    data-i18n-attr="aria-label:nav.themeToggleAria;title:nav.themeToggleTitle">
                    <svg class="sun-icon" data-icon="sun"></svg>
                    <svg class="moon-icon" data-icon="moon"></svg>
                </button>
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单" title="侧边栏菜单" aria-expanded="false"
                    data-i18n-attr="aria-label:nav.menuAria;title:nav.menuTitle">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 移动端侧栏遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 主布局 -->
    <div class="main-container" id="mainContainer">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <h3 data-i18n="sidebar.categories">分类目录</h3>
                <div id="sidebarCategories"></div>
            </div>
            <div class="sidebar-section">
                <h3 data-i18n="sidebar.tags">标签云</h3>
                <div class="sidebar-tags" id="sidebarTags"></div>
            </div>
            <div class="sidebar-section">
                <h3 data-i18n="sidebar.archives">归档</h3>
                <div id="sidebarArchives"></div>
            </div>
            <button class="sidebar-reset" id="sidebarReset" type="button" data-i18n="sidebar.reset">显示全部文章</button>
        </aside>

        <!-- 内容 -->
        <main class="content-area" id="contentArea">
            <div class="content-header" id="contentHeader">
                <span class="content-title" id="contentTitle" data-i18n="list.latest">最新文章</span>
                <span class="result-count" id="resultCount"></span>
            </div>
            <div class="loading-skeleton" id="loadingSkeleton">
                <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
            </div>
            <div id="contentBody"></div>
            <nav class="pagination" id="pagination" aria-label="分页" data-i18n-attr="aria-label:list.paginationAria"></nav>
        </main>
    </div>

    <!-- 页脚 -->
    <footer class="site-footer">
        <div class="footer-line">
            <span>© <span id="footerYear">2026</span> <span id="footerName" data-i18n="site.blogName">猫猫的回忆</span></span>
            <span>·</span>
            <span data-i18n="site.slogan">用心记录每一刻</span>
            <span>·</span>
            <a href="editor.html" title="打开写作助手" data-i18n-attr="title:nav.writeArticleTitle">
                <svg class="icon" data-icon="feather"></svg><span data-i18n="nav.writeArticle">写文章</span>
            </a>
        </div>
    </footer>

    <!-- 回到顶部 -->
    <button class="back-to-top" id="backToTop" aria-label="回到顶部" title="回到顶部"
        data-i18n-attr="aria-label:nav.backToTop;title:nav.backToTop"><svg class="icon" data-icon="arrow-up"></svg></button>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 本地依赖（离线可用）；marked 缺失时 main.js 会自动回退 CDN -->
    <script src="assets/vendor/marked.min.js"></script>
    <script src="assets/vendor/purify.min.js"></script>

    <!-- 工具 -->
    <script src="assets/js/utils/dom.js" defer></script>
    <script src="assets/js/utils/format.js" defer></script>
    <!-- 图标（全站统一的内联 SVG，替代 emoji） -->
    <script src="assets/js/ui/icons.js" defer></script>
    <!-- 多语言 -->
    <script src="assets/js/core/i18n.js" defer></script>
    <!-- 内核 -->
    <script src="assets/js/core/frontmatter.js" defer></script>
    <script src="assets/js/core/markdown.js" defer></script>
    <script src="assets/js/core/kernel.js" defer></script>
    <!-- UI 模块 -->
    <script src="assets/js/ui/theme.js" defer></script>
    <script src="assets/js/ui/toast.js" defer></script>
    <script src="assets/js/ui/router.js" defer></script>
    <script src="assets/js/ui/sidebar.js" defer></script>
    <script src="assets/js/ui/postlist.js" defer></script>
    <script src="assets/js/ui/article.js" defer></script>
    <script src="assets/js/ui/search.js" defer></script>
    <!-- 入口 -->
    <script src="assets/js/main.js" defer></script>
</body>
</html>
