<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 站点名走语言包 site.blogName（缺失时回退 config.json 的 blogName） -->
    <title data-i18n="site.blogName">猫猫的回忆</title>
    <meta name="description" content="记录温暖时光的静态博客" data-i18n-attr="content:site.description">
    <meta name="theme-color" content="#c3d3e8">
    <script>
        // ── 首帧状态统一入口（FOUC / 首帧主题错配防护）────────────────────
        // 这里是主题与雨效在首帧的唯一决策点：把结果显式写到 <html> 上，
        // 后面的 theme.js / rain.js 只是读取并沿用，绝不再各自推导一遍。
        //   blog-theme → <html data-theme="light|dark"> + color-scheme + meta
        //   blog-rain  → <html class="rain-off">
        // 显式写 data-theme（而不是「只在暗色时改」）能避免原生 select /
        // 滚动条 / 表单控件在首帧按 :root 默认值渲染成另一套配色。
        (function () {
            var root = document.documentElement;
            function read(key) {
                try { return localStorage.getItem(key); } catch (e) { return null; }
            }
            var saved = read('blog-theme');
            var dark = saved === 'dark';
            if (saved !== 'dark' && saved !== 'light') {
                try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; }
                catch (e) { dark = false; }
            }
            var theme = dark ? 'dark' : 'light';
            root.setAttribute('data-theme', theme);
            root.style.colorScheme = theme;
            var meta = document.querySelector('meta[name="theme-color"]');
            // 与 theme.js 的取值保持一致
            if (meta) meta.setAttribute('content', dark ? '#05080f' : '#c3d3e8');

            // 雨效：默认开；只有明确关过雨的用户才在首帧前补 rain-off，避免闪一帧雨
            if (read('blog-rain') === 'off') root.classList.add('rain-off');
        })();
    </script>
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/article.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <!-- ▼ 雨夜毛玻璃主题：必须加载在所有旧样式之后（整体覆盖外观，旧样式原样保留） -->
    <link rel="stylesheet" href="assets/css/glass-rain.css">
    <!-- ▲ 想回旧 UI：把上面这一行换回 neo-brutalism.css 并恢复 body 的 class 即可 -->
</head>

         所以这句话无法走语言包，这里直接中英双语写死；
         图标也直接内联（JS 关掉时 icons.js 不会执行，不能用 data-icon 占位符） -->
    <noscript>
        <p class="nojs-tip">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="6.6" cy="10.6" rx="1.9" ry="2.5"/><ellipse cx="10.4" cy="7" rx="1.9" ry="2.6"/><ellipse cx="14.6" cy="7" rx="1.9" ry="2.6"/><ellipse cx="18.4" cy="10.6" rx="1.9" ry="2.5"/><path d="M12.5 12.6c-3 0-5.9 2.4-5.9 5 0 1.7 1.4 2.9 3.1 2.9 1.1 0 1.9-.5 2.8-.5s1.7.5 2.8.5c1.7 0 3.1-1.2 3.1-2.9 0-2.6-2.9-5-5.9-5z"/>
            </svg>
            这个博客需要启用 JavaScript 才能阅读哦～ / This blog needs JavaScript enabled.
        </p>
    </noscript>

            <div class="header-actions">

                        autocomplete="off" aria-label="搜索文章"
                        data-i18n-attr="placeholder:nav.searchPlaceholder;aria-label:nav.searchAria">

                    <span class="search-kbd" aria-hidden="true">/</span>
                    <span class="search-icon" aria-hidden="true"><svg class="icon" data-icon="search"></svg></span>

                <button class="mobile-search-btn" id="mobileSearchBtn" aria-label="打开搜索" title="搜索"

                </button>
                <!-- 语言切换：选项由 config.json 的 languages 自动生成 -->
                <div class="lang-wrap" id="langWrap" hidden>
                    <select class="lang-select" id="langSelect" aria-label="选择界面语言" title="选择界面语言"
                        data-i18n-attr="aria-label:nav.languageAria;title:nav.languageAria"></select>
                </div>
                <button class="m3-icon-btn theme-toggle" id="themeToggle" aria-label="切换主题" title="切换亮色/暗色主题"
                    data-i18n-attr="aria-label:nav.themeToggleAria;title:nav.themeToggleTitle">
                    <svg class="sun-icon" data-icon="sun"></svg>
                    <svg class="moon-icon" data-icon="moon"></svg>
                </button>
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单" title="侧边栏菜单" aria-expanded="false"
                    data-i18n-attr="aria-label:nav.menuAria;title:nav.menuTitle">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 移动端侧栏遮罩 -->

    <!-- 主布局 -->

                <div class="sidebar-tags" id="sidebarTags"></div>

            <div class="sidebar-section">

            <button class="sidebar-reset" id="sidebarReset" type="button" data-i18n="sidebar.reset">显示全部文章</button>
        </aside>

        <!-- 内容 -->

                <span class="result-count" id="resultCount"></span>

            <div class="loading-skeleton" id="loadingSkeleton">

                <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-body"><div class="skeleton-line long"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div></div>
            </div>
            <div id="contentBody"></div>
            <nav class="pagination" id="pagination" aria-label="分页" data-i18n-attr="aria-label:list.paginationAria"></nav>
        </main>
    </div>

            <span>·</span>
